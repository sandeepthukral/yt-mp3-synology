services:
  yt2mp3:
    build: .
    container_name: yt2mp3
    restart: unless-stopped
    ports:
      - "3030:3030"
    environment:
      - PORT=3030
      - AUTH_TOKEN=${AUTH_TOKEN:?set AUTH_TOKEN in .env}
      - DOWNLOAD_TIMEOUT_MS=900000
      # A copy of every mp3 is written here, in addition to being returned to
      # whoever asked for it. Bound to /volume1/music/downloaded below.
      - SAVE_DIR=/share
      # Uncomment together with the matching volume below if YouTube starts
      # bot-blocking the NAS and you need to supply browser cookies.
      # - COOKIES_FILE=/cookies/cookies.txt
    volumes:
      - /volume1/music/downloaded:/share
      # Uncomment together with COOKIES_FILE above.
      # - /volume1/docker/yt-mp3/cookies:/cookies:ro
